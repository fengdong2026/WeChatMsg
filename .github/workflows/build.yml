name: build-exe
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        run: pyinstaller -n WeChatMsg --uac-admin --paths . --collect-all wxManager --collect-all exporter --add-data "exporter/resources;exporter/resources" --add-data "exporter/ffmpeg.exe;exporter" --add-data "wxManager/decrypt/version_list.json;wxManager/decrypt" wechat_tool.py
      - uses: actions/upload-artifact@v4
        with:
          name: WeChatMsg-win
          path: dist/
